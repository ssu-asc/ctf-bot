name: Check CTFs & Notify

on:
  schedule:
    - cron: "2-59/5 * * * *"  # 5분마다 확인 (정각 혼잡 회피, 실행 지연 가능)
  workflow_dispatch:
    inputs:
      test:
        description: "테스트 모드 (가장 가까운 CTF 1개 알림)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: kctf-notifications
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run notification script
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        working-directory: scripts
        run: python notify.py ${{ github.event.inputs.test == 'true' && '--test' || '' }}

      - name: Commit state changes
        if: ${{ !cancelled() }}  # 일부 전송이 실패해도 성공한 알림 이력은 보존
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/notified.json data/kctf.json
          git diff --staged --quiet || git commit -m "chore: update notified state"
          git pull --rebase
          git push
